<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        header {
            background: #1e3a8a;
            color: white;
            padding: 20px 60px;
        }

        header h1 {
            font-size: 24px;
        }

        .container {
            max-width: 800px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            color: #1e3a8a;
            text-decoration: none;
            font-weight: bold;
        }

        h2 {
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        .description {
            color: #6b7280;
            margin-bottom: 30px;
        }

        .notifications-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .notification-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            transition: background 0.2s;
        }

        .notification-card:hover {
            background: #f9fafb;
        }

        .notification-card.unread {
            border-left: 4px solid #1e3a8a;
        }

        .notification-title {
            font-size: 16px;
            font-weight: bold;
            color: #1e3a8a;
            margin-bottom: 8px;
        }

        .notification-message {
            color: #6b7280;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .notification-time {
            color: #9ca3af;
            font-size: 13px;
        }

        .notification-actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .found-btn {
            padding: 8px 16px;
            background: #166534;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .found-btn:hover {
            background: #14532d;
        }

        .found-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .found-btn.completed {
            background: #059669;
            cursor: default;
        }

        .no-notifications {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        .no-notifications h3 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        @media (max-width: 768px) {
            header {
                padding: 20px;
            }

            .container {
                margin: 30px auto;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Smart Campus Lost & Found</h1>
    </header>

    <div class="container">

        <a href="/" class="back">← Back to Home</a>

        <h2>Notifications</h2>

        <p class="description">Stay updated on your claims and items</p>

        <div id="notificationsContainer" class="notifications-list">
            <div class="loading">Loading notifications...</div>
        </div>

    </div>

    <script src="/js/auth.js"></script>

    <script>
        const notificationsContainer = document.getElementById('notificationsContainer');
        const currentUser = getCurrentUser();
        const isAdmin = currentUser && (currentUser.role === 'admin' || currentUser.role === 'security');

        if (!requireAuth()) {
            window.location.href = '/login.html';
        }

        if (currentUser) {
            fetch(`/api/notifications?user_id=${currentUser.id}`)
                .then(response => response.json())
                .then(data => {
                    if (data.success && data.notifications.length > 0) {
                        displayNotifications(data.notifications);
                    } else {
                        notificationsContainer.innerHTML = `
                            <div class="no-notifications">
                                <h3>No notifications</h3>
                                <p>You're all caught up!</p>
                            </div>
                        `;
                    }
                })
                .catch(error => {
                    console.error('Error:', error);

                    notificationsContainer.innerHTML = `
                        <div class="no-notifications">
                            <h3>Failed to load notifications</h3>
                            <p>Please try again later.</p>
                        </div>
                    `;
                });
        }

        function displayNotifications(notifications) {
            notificationsContainer.innerHTML = notifications.map(notification => `
                <div class="notification-card ${!notification.is_read ? 'unread' : ''}"
                     data-notification-id="${notification.id}"
                     data-report-id="${notification.report_id || ''}"
                     data-asset-status="${notification.asset_status || ''}">

                    <div class="notification-title">
                        ${notification.title}
                    </div>

                    <div class="notification-message">
                        ${notification.message}
                    </div>

                    <div class="notification-time">
                        ${formatDate(notification.created_at)}
                    </div>

                    ${notification.report_id && isAdmin ? `
                        <div class="notification-actions">
                            ${notification.asset_status === 'Lost' ? `
                                <button class="found-btn" 
                                        onclick="markAsFound(event, ${notification.report_id}, ${notification.id})">
                                    Found
                                </button>
                            ` : `
                                <button class="found-btn completed" disabled>
                                    Found ✓
                                </button>
                            `}
                        </div>
                    ` : ''}

                </div>
            `).join('');

            // Add click handlers for non-report notifications
            document.querySelectorAll('.notification-card').forEach(card => {
                card.addEventListener('click', function(e) {
                    const reportId = this.getAttribute('data-report-id');
                    if (!reportId) {
                        const notificationId = this.getAttribute('data-notification-id');
                        handleNotificationClick(notificationId);
                    }
                });
            });
        }

        async function handleNotificationClick(notificationId) {
            try {
                await fetch(`/api/notifications/${notificationId}/read`, {
                    method: 'PUT'
                });
                location.reload();
            } catch (error) {
                console.error('Error handling notification click:', error);
            }
        }

        async function markAsFound(event, reportId, notificationId) {
            event.stopPropagation(); // Prevent the card click handler

            const button = event.target;
            if (button.disabled) return;

            const originalText = button.textContent;
            button.disabled = true;
            button.textContent = 'Processing...';

            try {
                const response = await makeAuthenticatedRequest(`/api/asset-reports/${reportId}/found`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();

                if (data.success) {
                    button.textContent = 'Found ✓';
                    button.classList.add('completed');
                    
                    // Mark the notification as read
                    await fetch(`/api/notifications/${notificationId}/read`, {
                        method: 'PUT'
                    });
                } else {
                    alert(data.message || 'Failed to mark asset as found.');
                    button.disabled = false;
                    button.textContent = originalText;
                }
            } catch (error) {
                console.error('Error marking as found:', error);
                alert('Unable to connect to the server.');
                button.disabled = false;
                button.textContent = originalText;
            }
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString();
        }
    </script>

</body>

</html>
