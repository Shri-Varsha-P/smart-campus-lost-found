<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        header {
            background: #1e3a8a;
            color: white;
            padding: 20px 60px;
        }

        header h1 {
            font-size: 24px;
        }

        .container {
            max-width: 800px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            color: #1e3a8a;
            text-decoration: none;
            font-weight: bold;
        }

        h2 {
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        .description {
            color: #6b7280;
            margin-bottom: 30px;
        }

        .notifications-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .notification-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            transition: background 0.2s;
        }

        .notification-card:hover {
            background: #f9fafb;
        }

        .notification-card.unread {
            border-left: 4px solid #1e3a8a;
        }

        .notification-title {
            font-size: 16px;
            font-weight: bold;
            color: #1e3a8a;
            margin-bottom: 8px;
        }

        .notification-message {
            color: #6b7280;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .notification-time {
            color: #9ca3af;
            font-size: 13px;
        }

        .no-notifications {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        .no-notifications h3 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        @media (max-width: 768px) {
            header {
                padding: 20px;
            }

            .container {
                margin: 30px auto;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>Smart Campus Lost & Found</h1>
    </header>

    <div class="container">
        <a href="/" class="back">← Back to Home</a>

        <h2>Notifications</h2>
        <p class="description">Stay updated on your claims and items</p>

        <div id="notificationsContainer" class="notifications-list">
            <div class="loading">Loading notifications...</div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        const notificationsContainer = document.getElementById('notificationsContainer');
        const currentUser = getCurrentUser();

        if (!requireAuth()) {
            return;
        }

        if (currentUser) {
            fetch(`/api/notifications?user_id=${currentUser.id}`)
            .then(response => response.json())
            .then(data => {
                if (data.success && data.notifications.length > 0) {
                    displayNotifications(data.notifications);
                } else {
                    notificationsContainer.innerHTML = `
                        <div class="no-notifications">
                            <h3>No notifications</h3>
                            <p>You're all caught up!</p>
                        </div>
                    `;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                notificationsContainer.innerHTML = `
                    <div class="no-notifications">
                        <h3>Failed to load notifications</h3>
                        <p>Please try again later.</p>
                    </div>
                `;
            });

        function displayNotifications(notifications) {
            notificationsContainer.innerHTML = notifications.map(notification => `
                <div class="notification-card ${!notification.is_read ? 'unread' : ''}" onclick="markAsRead(${notification.id})">
                    <div class="notification-title">${notification.title}</div>
                    <div class="notification-message">${notification.message}</div>
                    <div class="notification-time">${formatDate(notification.created_at)}</div>
                </div>
            `).join('');
        }

        async function markAsRead(notificationId) {
            try {
                await fetch(`/api/notifications/${notificationId}/read`, {
                    method: 'PUT'
                });
                location.reload();
            } catch (error) {
                console.error('Error marking as read:', error);
            }
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString();
        }
    </script>
</body>
</html>
