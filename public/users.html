<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        header {
            background: #1e3a8a;
            color: white;
            padding: 20px 60px;
        }

        header h1 {
            font-size: 24px;
        }

        .container {
            max-width: 1200px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            color: #1e3a8a;
            text-decoration: none;
            font-weight: bold;
        }

        h2 {
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        .description {
            color: #6b7280;
            margin-bottom: 30px;
        }

        .users-table {
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #1e3a8a;
            color: white;
        }

        th, td {
            padding: 15px 20px;
            text-align: left;
        }

        th {
            font-weight: bold;
            font-size: 14px;
        }

        tbody tr {
            border-bottom: 1px solid #e5e7eb;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody tr:hover {
            background: #f9fafb;
        }

        .role-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .role-student {
            background: #dbeafe;
            color: #1e40af;
        }

        .role-staff {
            background: #d1fae5;
            color: #065f46;
        }

        .role-admin {
            background: #fee2e2;
            color: #991b1b;
        }

        .role-security {
            background: #fef3c7;
            color: #92400e;
        }

        .role-notification_manager {
            background: #e0e7ff;
            color: #3730a3;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-assign {
            background: #1e3a8a;
            color: white;
        }

        .btn-assign:hover {
            background: #1e40af;
        }

        .btn-assign:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .no-users {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        @media (max-width: 768px) {
            header {
                padding: 20px;
            }

            .container {
                margin: 30px auto;
            }

            table {
                font-size: 14px;
            }

            th, td {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Smart Campus Lost & Found</h1>
    </header>

    <div class="container">
        <a href="/admin.html" class="back">← Back to Admin Dashboard</a>

        <h2>User Management</h2>
        <p class="description">Manage user roles and permissions</p>

        <div id="usersContainer" class="users-table">
            <div class="loading">Loading users...</div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        const usersContainer = document.getElementById('usersContainer');

function initializePage() {
    if (!requireAuth()) {
        window.location.href = '/login.html';
        return;
    }

    if (!requireRole(['admin'])) {
        alert('Access denied. Admin role required.');
        window.location.href = '/';
        return;
    }

    loadUsers();
}

initializePage();
        function loadUsers() {
            makeAuthenticatedRequest('/api/users')
                .then(response => response.json())
                .then(data => {
                    if (data.success && data.users.length > 0) {
                        displayUsers(data.users);
                    } else {
                        usersContainer.innerHTML = `
                            <div class="no-users">
                                <h3>No Users Found</h3>
                                <p>No users in the system yet.</p>
                            </div>
                        `;
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    usersContainer.innerHTML = `
                        <div class="no-users">
                            <h3>Failed to Load Users</h3>
                            <p>Please try again later.</p>
                        </div>
                    `;
                });
        }

        function displayUsers(users) {
            usersContainer.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Current Role</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${users.map(user => `
                            <tr>
                                <td>${user.name}</td>
                                <td>${user.email}</td>
                                <td><span class="role-badge role-${user.role}">${formatRole(user.role)}</span></td>
                                <td>
                                    ${user.role !== 'notification_manager' ? `
                                        <button class="btn btn-assign" onclick="assignNotificationManager(${user.id}, '${user.name}')">
                                            Assign Notification Manager
                                        </button>
                                    ` : `
                                        <span style="color: #6b7280; font-size: 12px;">Already Notification Manager</span>
                                    `}
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function formatRole(role) {
            switch(role) {
                case 'notification_manager':
                    return 'Notification Manager';
                default:
                    return role.charAt(0).toUpperCase() + role.slice(1);
            }
        }

        async function assignNotificationManager(userId, userName) {
            if (!confirm(`Are you sure you want to assign the Notification Manager role to ${userName}?`)) {
                return;
            }

            try {
                const response = await makeAuthenticatedRequest(`/api/users/${userId}/role`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ role: 'notification_manager' })
                });

                const data = await response.json();

                if (data.success) {
                    alert(`Notification Manager role assigned to ${userName} successfully!`);
                    loadUsers(); // Reload the list
                } else {
                    alert(data.message || 'Failed to assign role.');
                }
            } catch (error) {
                console.error('Error assigning role:', error);
                alert('Unable to connect to the server.');
            }
        }
    </script>
</body>
</html>
