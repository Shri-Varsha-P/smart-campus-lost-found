<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #1e3a8a;
            margin-bottom: 10px;
            text-align: center;
        }

        .description {
            color: #6b7280;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 8px;
        }

        .radio-group label {
            display: flex;
            align-items: center;
            font-weight: normal;
            margin-bottom: 0;
        }

        .radio-group input {
            width: auto;
            margin-right: 8px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #1e3a8a;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #172e6b;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        #message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            display: none;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #6b7280;
        }

        .login-link a {
            color: #1e3a8a;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .admin-code-info {
            font-size: 12px;
            color: #6b7280;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .container {
                margin: 20px;
                padding: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sign Up</h1>
        <p class="description">Create your account</p>

        <form id="signupForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >
            </div>

            <div class="form-group">
                <label>Role</label>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="role" value="student" checked onchange="handleRoleChange()">
                        Student
                    </label>
                    <label>
                        <input type="radio" name="role" value="staff" onchange="handleRoleChange()">
                        Teacher/Staff
                    </label>
                </div>
            </div>

            <div class="form-group" id="adminCodeGroup" style="display: none;">
                <label for="adminCode">Admin Registration Code (Optional)</label>
                <input
                    type="text"
                    id="adminCode"
                    placeholder="Enter admin code if applicable"
                >
                <div class="admin-code-info">Are you an administrator? Enter the Admin Registration Code if applicable.</div>
            </div>

            <button
                type="submit"
                id="submitButton"
            >
                Sign Up
            </button>
        </form>

        <div id="message"></div>

        <div class="login-link">
            Already have an account? <a href="/login.html">Login</a>
        </div>
    </div>

    <script>
        function handleRoleChange() {
            const role = document.querySelector('input[name="role"]:checked').value;
            const adminCodeGroup = document.getElementById('adminCodeGroup');
            
            if (role === 'staff') {
                adminCodeGroup.style.display = 'block';
            } else {
                adminCodeGroup.style.display = 'none';
                document.getElementById('adminCode').value = '';
            }
        }

        const form = document.getElementById('signupForm');
        const message = document.getElementById('message');
        const submitButton = document.getElementById('submitButton');

        form.addEventListener('submit', async function(event) {
            event.preventDefault();

            submitButton.disabled = true;
            submitButton.textContent = 'Creating account...';

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const role = document.querySelector('input[name="role"]:checked').value;
            const adminCode = document.getElementById('adminCode').value;

            try {
                const response = await fetch('/api/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        name, 
                        email, 
                        password, 
                        confirmPassword, 
                        role, 
                        adminCode 
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showMessage('Account created successfully! Redirecting to login...', true);
                    
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 1500);
                } else {
                    showMessage(data.message || 'Sign up failed.', false);
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('Unable to connect to the server.', false);
            }

            submitButton.disabled = false;
            submitButton.textContent = 'Sign Up';
        });

        function showMessage(text, success) {
            message.style.display = 'block';
            message.textContent = text;

            if (success) {
                message.style.background = '#dcfce7';
                message.style.color = '#166534';
            } else {
                message.style.background = '#fee2e2';
                message.style.color = '#991b1b';
            }
        }
    </script>
</body>
</html>
