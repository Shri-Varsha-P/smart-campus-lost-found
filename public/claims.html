<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Claims</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        header {
            background: #1e3a8a;
            color: white;
            padding: 20px 60px;
        }

        header h1 {
            font-size: 24px;
        }

        .container {
            max-width: 1000px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            color: #1e3a8a;
            text-decoration: none;
            font-weight: bold;
        }

        h2 {
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        .description {
            color: #6b7280;
            margin-bottom: 30px;
        }

        .claims-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .claim-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .claim-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .claim-item {
            font-size: 18px;
            font-weight: bold;
            color: #1e3a8a;
        }

        .claim-status {
            padding: 6px 16px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: bold;
        }

        .status-Pending {
            background: #fef3c7;
            color: #92400e;
        }

        .status-Approved {
            background: #dcfce7;
            color: #166534;
        }

        .status-Rejected {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-Disputed {
            background: #f3e8ff;
            color: #7c3aed;
        }

        .claim-message {
            color: #6b7280;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .claim-meta {
            color: #9ca3af;
            font-size: 13px;
        }

        .no-claims {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        .no-claims h3 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        @media (max-width: 768px) {
            header {
                padding: 20px;
            }

            .container {
                margin: 30px auto;
            }

            .claim-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>Smart Campus Lost & Found</h1>
    </header>

    <div class="container">
        <a href="/" class="back">← Back to Home</a>

        <h2>My Claims</h2>
        <p class="description">View the status of your ownership claims for found items</p>

        <div id="claimsContainer" class="claims-list">
            <div class="loading">Loading claims...</div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const claimsContainer = document.getElementById('claimsContainer');
            const currentUser = getCurrentUser();

            if (!requireAuth()) {
                return;
            }

            makeAuthenticatedRequest('/api/claims')
            .then(response => response.json())
            .then(data => {
                if (data.success && data.claims.length > 0) {
                    displayClaims(data.claims);
                } else {
                    claimsContainer.innerHTML = `
                        <div class="no-claims">
                            <h3>No claims submitted yet</h3>
                            <p>Browse found items and submit claims for items that belong to you.</p>
                        </div>
                    `;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                claimsContainer.innerHTML = `
                    <div class="no-claims">
                        <h3>Failed to load claims</h3>
                        <p>Please try again later.</p>
                    </div>
                `;
            });

            function displayClaims(claims) {
                const isAdmin = currentUser.role === 'admin' || currentUser.role === 'security';
                
                claimsContainer.innerHTML = claims.map(claim => `
                    <div class="claim-card">
                        <div class="claim-header">
                            <div class="claim-item">${claim.item_title || 'Unknown Item'}</div>
                            <span class="claim-status status-${claim.status}">${claim.status}</span>
                        </div>
                        <div class="claim-message">${claim.message}</div>
                        <div class="claim-meta">
                            Claimant: ${claim.claimant_name || 'Unknown'} | Submitted on ${formatDate(claim.created_at)}
                        </div>
                        ${isAdmin && claim.status === 'Pending' ? `
                            <div class="claim-actions" style="margin-top: 15px; display: flex; gap: 10px;">
                                <button class="approve-btn" data-claim-id="${claim.id}" data-status="Approved" style="flex: 1; padding: 10px; background: #166534; color: white; border: none; border-radius: 6px; cursor: pointer;">Approve</button>
                                <button class="reject-btn" data-claim-id="${claim.id}" data-status="Rejected" style="flex: 1; padding: 10px; background: #991b1b; color: white; border: none; border-radius: 6px; cursor: pointer;">Reject</button>
                            </div>
                        ` : ''}
                    </div>
                `).join('');

                document.querySelectorAll('.approve-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        updateClaimStatus(this.dataset.claimId, this.dataset.status);
                    });
                });

                document.querySelectorAll('.reject-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        updateClaimStatus(this.dataset.claimId, this.dataset.status);
                    });
                });
            }

            function updateClaimStatus(claimId, status) {
                makeAuthenticatedRequest(`/api/claims/${claimId}/status`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert('Claim status updated successfully!');
                        location.reload();
                    } else {
                        alert(data.message || 'Failed to update claim status.');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Unable to connect to the server.');
                });
            }

            function formatDate(dateString) {
                const date = new Date(dateString);
                return date.toLocaleString();
            }
        });
    </script>
</body>
</html>
