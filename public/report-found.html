<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Found Item</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        header {
            background: #1e3a8a;
            color: white;
            padding: 20px 60px;
        }

        header h1 {
            font-size: 24px;
        }

        .container {
            max-width: 700px;
            margin: 45px auto;
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            color: #1e3a8a;
            text-decoration: none;
            font-weight: bold;
        }

        h2 {
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        .description {
            color: #6b7280;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        input[type="file"] {
            background: #f9fafb;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #1e3a8a;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #172e6b;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        #message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            display: none;
        }
    </style>
</head>

<body>
    <header>
        <h1>Smart Campus Lost & Found</h1>
    </header>

    <div class="container">
        <a href="/" class="back">← Back to Home</a>

        <h2>Report a Found Item</h2>

        <p class="description">
            Provide details about an item you found on campus.
        </p>

        <form id="foundItemForm">
            <div class="form-group">
                <label for="title">Item Name</label>
                <input type="text" id="title" placeholder="Example: Black Wallet" required>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" placeholder="Describe the item, colour, identifying features, etc." required></textarea>
            </div>

            <div class="form-group">
                <label for="location">Found Location</label>
                <input type="text" id="location" placeholder="Example: IT Block - 2nd Floor" required>
            </div>

            <div class="form-group">
                <label for="foundTime">Date and Time Found</label>
                <input type="datetime-local" id="foundTime" required>
            </div>

            <div class="form-group">
                <label for="image">Item Image</label>
                <input type="file" id="image" accept="image/jpeg,image/png,image/gif,image/webp,image/bmp" required>
            </div>

            <button type="submit" id="submitButton">Submit Found Item Report</button>
        </form>

        <div id="message"></div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById("foundItemForm");
            const message = document.getElementById("message");
            const submitButton = document.getElementById("submitButton");

            if (!requireAuth()) {
                return;
            }

            form.addEventListener("submit", async function(event) {
            event.preventDefault();

            submitButton.disabled = true;
            submitButton.textContent = "Submitting...";

            const title = document.getElementById("title").value;
            const description = document.getElementById("description").value;
            const location = document.getElementById("location").value;
            const foundTime = document.getElementById("foundTime").value;
            const image = document.getElementById("image").files[0];

            if (!image) {
                showMessage("Please select an image.", false);
                resetButton();
                return;
            }

            if (image.size > 5 * 1024 * 1024) {
                showMessage("Image must be smaller than 5 MB.", false);
                resetButton();
                return;
            }

            const formData = new FormData();
            formData.append("title", title);
            formData.append("description", description);
            formData.append("location", location);
            formData.append("found_time", foundTime);
            formData.append("image", image);

            try {
                const response = await makeAuthenticatedRequest("/api/found-items", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showMessage("Found item reported successfully! Item ID: " + data.item_id, true);
                    form.reset();
                } else {
                    showMessage(data.message || "Failed to report found item.", false);
                }
            } catch (error) {
                console.error("Error:", error);
                showMessage("Unable to connect to the server.", false);
            }

            resetButton();
        });

        function showMessage(text, success) {
            message.style.display = "block";
            message.textContent = text;

            if (success) {
                message.style.background = "#dcfce7";
                message.style.color = "#166534";
            } else {
                message.style.background = "#fee2e2";
                message.style.color = "#991b1b";
            }
        }

        function resetButton() {
            submitButton.disabled = false;
            submitButton.textContent = "Submit Found Item Report";
        }
        });
    </script>
</body>
</html>
