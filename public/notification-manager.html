<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Manager Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        header {
            background: #1e3a8a;
            color: white;
            padding: 20px 60px;
        }

        header h1 {
            font-size: 24px;
        }

        .container {
            max-width: 1200px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            color: #1e3a8a;
            text-decoration: none;
            font-weight: bold;
        }

        h2 {
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        .description {
            color: #6b7280;
            margin-bottom: 30px;
        }

        .alerts-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .alert-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            border-left: 4px solid #f59e0b;
        }

        .alert-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .alert-title {
            font-size: 18px;
            font-weight: bold;
            color: #1e3a8a;
        }

        .alert-status {
            background: #fef3c7;
            color: #92400e;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .alert-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            font-size: 12px;
            color: #6b7280;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 14px;
            color: #1f2937;
        }

        .alert-message {
            background: #f9fafb;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            white-space: pre-line;
            color: #4b5563;
        }

        .alert-actions {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-approve {
            background: #166534;
            color: white;
        }

        .btn-approve:hover {
            background: #14532d;
        }

        .btn-reject {
            background: #dc2626;
            color: white;
        }

        .btn-reject:hover {
            background: #b91c1c;
        }

        .btn-view {
            background: #1e3a8a;
            color: white;
            text-decoration: none;
            display: inline-block;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
        }

        .btn-view:hover {
            background: #1e40af;
        }

        .btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .no-alerts {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        .no-alerts h3 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        @media (max-width: 768px) {
            header {
                padding: 20px;
            }

            .container {
                margin: 30px auto;
            }

            .alert-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Smart Campus Lost & Found</h1>
    </header>

    <div class="container">
        <a href="/" class="back">← Back to Home</a>

        <h2>Notification Manager Dashboard</h2>
        <p class="description">Review and approve campus asset lost alerts before broadcasting to all users</p>

        <div id="alertsContainer" class="alerts-list">
            <div class="loading">Loading pending alerts...</div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        const alertsContainer = document.getElementById('alertsContainer');

function initializePage() {
    if (!requireAuth()) {
        window.location.href = '/login.html';
        return;
    }

    if (!requireRole(['notification_manager'])) {
        alert('Access denied. Notification Manager role required.');
        window.location.href = '/';
        return;
    }

    loadPendingAlerts();
}

initializePage();

        function loadPendingAlerts() {
            makeAuthenticatedRequest('/api/notification-manager/pending-alerts')
                .then(response => response.json())
                .then(data => {
                    if (data.success && data.alerts.length > 0) {
                        displayAlerts(data.alerts);
                    } else {
                        alertsContainer.innerHTML = `
                            <div class="no-alerts">
                                <h3>No Pending Alerts</h3>
                                <p>You're all caught up! No campus asset alerts awaiting review.</p>
                            </div>
                        `;
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alertsContainer.innerHTML = `
                        <div class="no-alerts">
                            <h3>Failed to Load Alerts</h3>
                            <p>Please try again later.</p>
                        </div>
                    `;
                });
        }

        function displayAlerts(alerts) {
            alertsContainer.innerHTML = alerts.map(alert => `
                <div class="alert-card" data-alert-id="${alert.id}">
                    <div class="alert-header">
                        <div class="alert-title">${alert.title}</div>
                        <div class="alert-status">Pending Review</div>
                    </div>

                    <div class="alert-info">
                        <div class="info-item">
                            <div class="info-label">Asset Name</div>
                            <div class="info-value">${alert.asset_name || 'N/A'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Asset ID</div>
                            <div class="info-value">${alert.asset_identifier || 'N/A'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Department</div>
                            <div class="info-value">${alert.asset_department || 'N/A'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Status</div>
                            <div class="info-value">${alert.asset_status || 'N/A'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Lost Since</div>
                            <div class="info-value">${alert.asset_lost_at ? formatDate(alert.asset_lost_at) : 'N/A'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Alert Created</div>
                            <div class="info-value">${formatDate(alert.created_at)}</div>
                        </div>
                    </div>

                    <div class="alert-message">${alert.message}</div>

                    <div class="alert-actions">
                        <button class="btn btn-approve" onclick="approveAlert(${alert.id}, this)">
                            YES - Post to All Users
                        </button>
                        <button class="btn btn-reject" onclick="rejectAlert(${alert.id}, this)">
                            NO - Do Not Post
                        </button>
                        <a href="/assets.html" class="btn btn-view">View Asset</a>
                    </div>
                </div>
            `).join('');
        }

        async function approveAlert(alertId, button) {
            if (!confirm('Are you sure you want to broadcast this campus asset lost alert to all users?')) {
                return;
            }

            const card = button.closest('.alert-card');
            const buttons = card.querySelectorAll('.btn');
            buttons.forEach(btn => btn.disabled = true);
            button.textContent = 'Processing...';

            try {
                const response = await makeAuthenticatedRequest(`/api/notification-manager/alerts/${alertId}/approve`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();

                if (data.success) {
                    alert('Alert approved and broadcast to all users!');
                    loadPendingAlerts(); // Reload the list
                } else {
                    alert(data.message || 'Failed to approve alert.');
                    buttons.forEach(btn => btn.disabled = false);
                    button.textContent = 'YES - Post to All Users';
                }
            } catch (error) {
                console.error('Error approving alert:', error);
                alert('Unable to connect to the server.');
                buttons.forEach(btn => btn.disabled = false);
                button.textContent = 'YES - Post to All Users';
            }
        }

        async function rejectAlert(alertId, button) {
            if (!confirm('Are you sure you want to reject this alert? It will NOT be broadcast to users.')) {
                return;
            }

            const card = button.closest('.alert-card');
            const buttons = card.querySelectorAll('.btn');
            buttons.forEach(btn => btn.disabled = true);
            button.textContent = 'Processing...';

            try {
                const response = await makeAuthenticatedRequest(`/api/notification-manager/alerts/${alertId}/reject`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();

                if (data.success) {
                    alert('Alert rejected. No broadcast sent.');
                    loadPendingAlerts(); // Reload the list
                } else {
                    alert(data.message || 'Failed to reject alert.');
                    buttons.forEach(btn => btn.disabled = false);
                    button.textContent = 'NO - Do Not Post';
                }
            } catch (error) {
                console.error('Error rejecting alert:', error);
                alert('Unable to connect to the server.');
                buttons.forEach(btn => btn.disabled = false);
                button.textContent = 'NO - Do Not Post';
            }
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString();
        }
    </script>
</body>
</html>
