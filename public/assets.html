<div class="container">
    <a href="/" class="back">← Back to Home</a>

    <h2>Institutional Assets</h2>
    <p class="description">
        View and manage college-owned equipment and assets
    </p>

    <div class="actions">
        <a href="/register-asset.html" class="btn primary">
            Register New Asset (Admin)
        </a>

        <a href="/asset-reports.html" class="btn secondary">
            View Asset Reports
        </a>
    </div>

    <div id="assetsContainer" class="assets-grid">
        <div class="loading">Loading assets...</div>
    </div>
</div>

<script src="/js/auth.js"></script>

<script>
    const assetsContainer = document.getElementById('assetsContainer');

    /*
     * Require the user to be logged in.
     * The /api/assets endpoint requires authentication.
     */
    if (!requireAuth()) {
        // requireAuth handles redirecting unauthenticated users.
    } else {
        loadAssets();
    }

    function loadAssets() {
        /*
         * IMPORTANT:
         * Do not use plain fetch() here.
         * /api/assets requires the JWT Authorization header.
         */
        makeAuthenticatedRequest('/api/assets')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                return response.json();
            })
            .then(data => {
                if (data.success && Array.isArray(data.assets) && data.assets.length > 0) {
                    displayAssets(data.assets);
                } else {
                    assetsContainer.innerHTML = `
                        <div class="no-assets">
                            <h3>No assets registered yet</h3>
                            <p>Add institutional assets to track them using QR codes.</p>
                        </div>
                    `;
                }
            })
            .catch(error => {
                console.error('Error loading assets:', error);

                assetsContainer.innerHTML = `
                    <div class="no-assets">
                        <h3>Failed to load assets</h3>
                        <p>Please try again later.</p>
                    </div>
                `;
            });
    }

    function displayAssets(assets) {
        const currentUser = getCurrentUser();
        const isAdmin = currentUser && currentUser.role === 'admin';

        assetsContainer.innerHTML = assets.map(asset => `
            <div class="asset-card">

                <div class="asset-id">
                    ID: ${escapeHtml(asset.asset_id)}
                </div>

                <div
                    class="asset-name"
                    onclick="viewAsset(${asset.id})"
                    style="cursor: pointer;"
                >
                    ${escapeHtml(asset.name)}
                </div>

                <div class="asset-department">
                    ${escapeHtml(asset.department || 'No department')}
                </div>

                <span class="asset-status status-${escapeHtml(asset.status)}">
                    ${escapeHtml(asset.status)}
                </span>

                ${
                    asset.lost_at
                        ? `
                            <div style="color: #991b1b; font-size: 13px; margin-top: 8px;">
                                Lost on ${formatDate(asset.lost_at)}
                            </div>
                        `
                        : ''
                }

                ${
                    asset.qr_code
                        ? `
                            <div class="asset-qr">
                                <img
                                    src="${escapeHtml(asset.qr_code)}"
                                    alt="QR Code"
                                >
                            </div>
                        `
                        : ''
                }

                ${
                    isAdmin && asset.status === 'Available'
                        ? `
                            <button
                                class="mark-lost-btn"
                                onclick="markAsLost(${asset.id}, '${escapeJsString(asset.asset_id)}')"
                            >
                                Mark Lost
                            </button>
                        `
                        : ''
                }

            </div>
        `).join('');
    }

    function viewAsset(id) {
        window.location.href = `/asset.html?id=${id}`;
    }

    function formatDate(dateString) {
        if (!dateString) {
            return 'N/A';
        }

        const date = new Date(dateString);

        if (isNaN(date.getTime())) {
            return 'N/A';
        }

        return date.toLocaleString();
    }

    function markAsLost(assetId, assetIdentifier) {
        if (!confirm(`Mark asset ${assetIdentifier} as Lost?`)) {
            return;
        }

        const status = 'Lost';
        const lost_at = new Date().toISOString();

        makeAuthenticatedRequest(`/api/assets/${assetId}/status`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                status: status,
                lost_at: lost_at
            })
        })
        .then(response => {
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            return response.json();
        })
        .then(data => {
            if (data.success) {
                alert('Asset marked as Lost successfully!');
                location.reload();
            } else {
                alert(data.message || 'Failed to mark asset as Lost.');
            }
        })
        .catch(error => {
            console.error('Error marking asset as lost:', error);
            alert('Unable to connect to the server.');
        });
    }

    /*
     * Small helpers so asset data does not break the HTML/onclick
     * when it contains special characters.
     */
    function escapeHtml(value) {
        if (value === null || value === undefined) {
            return '';
        }

        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function escapeJsString(value) {
        if (value === null || value === undefined) {
            return '';
        }

        return String(value)
            .replace(/\\/g, '\\\\')
            .replace(/'/g, "\\'");
    }
</script>
